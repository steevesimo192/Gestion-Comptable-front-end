<a
  href="#contenu"
  class="sr-only focus:not-sr-only focus:absolute focus:top-3 focus:left-3 focus:z-[100] focus:rounded-lg focus:bg-brand-900 focus:px-3.5 focus:py-2 focus:text-white"
>
  Aller au contenu
</a>

<div class="grid min-h-screen grid-cols-1 lg:grid-cols-[264px_minmax(0,1fr)]">
  <app-sidebar [open]="navOpen()" (closed)="navOpen.set(false)" />

  <div class="flex min-w-0 flex-col">
    <app-topbar (menu)="navOpen.set(true)" />
    <main id="contenu" tabindex="-1" class="w-full max-w-[1480px] px-4 pt-2 pb-10 outline-none lg:px-8 lg:pb-14">
      <router-outlet />
    </main>
  </div>
</div>

@if (navOpen()) {
  <div class="fixed inset-0 z-40 bg-brand-950/45 lg:hidden" (click)="navOpen.set(false)"></div>
}
