<section class="panel" aria-labelledby="shortcuts-title">
  <div class="panel-head">
    <div>
      <h3 id="shortcuts-title" class="panel-title">Raccourcis</h3>
      <p class="panel-sub">Les actions que vous faites le plus souvent</p>
    </div>
  </div>

  <ul class="grid gap-2.5">
    @for (s of items(); track s.label) {
      <li>
        @if (s.link) {
          <a [routerLink]="s.link" class="btn w-full justify-start px-4 py-3" [class]="s.primary ? 'btn-primary' : 'btn-quiet'">
            <app-icon [name]="s.icon" />
            {{ s.label }}
          </a>
        } @else {
          <button
            type="button"
            class="btn w-full cursor-not-allowed justify-start px-4 py-3 opacity-60"
            [class]="s.primary ? 'btn-primary' : 'btn-quiet'"
            title="Bientôt disponible"
            disabled
          >
            <app-icon [name]="s.icon" />
            {{ s.label }}
          </button>
        }
      </li>
    }
  </ul>
</section>
